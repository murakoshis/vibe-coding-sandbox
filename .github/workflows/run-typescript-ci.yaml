name: Run TypeScript CI
on:
  push:
    branches:
      - main
      - feature/*
    paths:
      - 'typescript/**'
      - '.github/workflows/run-typescript-ci.yaml'
      - '.github/actions/setup-nodejs-and-pnpm/action.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'main')}}

permissions:
  contents: read

defaults:
  run:
    working-directory: typescript

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-nodejs-and-pnpm
        with:
          working-directory: typescript

      - name: Cache ESLint
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: typescript/.cache/eslint/.eslintcache
          key: eslint-${{ hashFiles('typescript/eslint.config.js', 'typescript/pnpm-lock.yaml', 'typescript/package.json') }}
          restore-keys: eslint-

      - name: Run ESLint
        run: pnpm lint:eslint

  prettier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-nodejs-and-pnpm
        with:
          working-directory: typescript

      - name: Run Prettier
        run: pnpm lint:prettier

  depcruise:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-nodejs-and-pnpm
        with:
          working-directory: typescript

      - name: Run Dependency Cruiser
        run: pnpm depcruise

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-nodejs-and-pnpm
        with:
          working-directory: typescript

      - name: Run TypeScript Type Check
        run: pnpm typecheck
